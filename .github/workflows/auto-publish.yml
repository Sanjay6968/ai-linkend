name: Auto-Publish Scheduled Posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Publisher
        run: |
          curl -s -f "https://ai-linkend-two.vercel.app/api/cron/process-scheduled" || exit 0
